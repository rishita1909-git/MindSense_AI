{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>😊 AI Face Emotion Detection</h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">
                        Upload Your Image
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        name="image"
                        accept="image/*"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    Detect Emotion

                </button>

            </form>

            {% if image %}

            <hr>

            <div class="text-center">

                <img
                    src="{{ image }}"
                    class="img-fluid rounded shadow"
                    width="300">

            </div>

            {% endif %}

            {% if result %}

            <hr>

            <div class="row">

                <div class="col-md-6">

                    <div class="card bg-info text-white">

                        <div class="card-body text-center">

                            <h5>Detected Emotion</h5>

                            <h2>{{ result.emotion }}</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="card bg-success text-white">

                        <div class="card-body text-center">

                            <h5>Confidence</h5>

                            <h2>{{ result.confidence }}%</h2>

                        </div>

                    </div>

                </div>

            </div>

            {% if result.error %}

            <div class="alert alert-danger mt-3">

                {{ result.error }}

            </div>

            {% endif %}

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}python app.py
